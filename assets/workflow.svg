    <rect width="250" height="190" rx="20" fill="#F7F9FA"/><text x="125" y="38" text-anchor="middle" fill="#42545F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">URBAN CONTEXT</text>
