<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
  <title id="title">Post-wildfire housing recovery workflow</title>
  <desc id="desc">Longitudinal Street View imagery is translated into recovery trajectories, linked to urban context and analyzed with statistical models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#143448"/><stop offset="1" stop-color="#2E718A"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#071923" flood-opacity="0.20"/></filter>
  </defs>
  <rect width="1280" height="470" rx="28" fill="url(#bg)"/>
  <circle cx="1145" cy="45" r="165" fill="#FFFFFF" opacity="0.045"/>
  <text x="70" y="82" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">From longitudinal imagery to recovery evidence</text>
  <text x="72" y="123" fill="#DCEAF0" font-family="Arial, Helvetica, sans-serif" font-size="20">Street View imagery · recovery trajectories · urban context · statistical models</text>
